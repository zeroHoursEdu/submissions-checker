# Build (and on a version tag, publish) the submissions-checker-runner image.
#
# The runner image is the versioned artifact subject repos depend on. Tagging a release
# `runner-v1.2.3` builds and pushes `ghcr.io/<owner>/submissions-checker-runner:1.2.3`
# (plus the matching major tag). Pushes to main only build + smoke-test the image.
name: runner-image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "docker/runner/Dockerfile"
      - ".github/workflows/runner-image.yml"
    tags:
      - "runner-v*"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "docker/runner/Dockerfile"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A GitHub owner may contain capitals; an OCI repository name may not, and the
      # build fails outright on an uppercase tag. Lowercase it here rather than
      # hardcoding the owner, so a fork stays correct.
      - name: Derive image name and version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/runner-v* ]]; then
            V="${GITHUB_REF#refs/tags/runner-v}"
          else
            V="0.0.0-${GITHUB_SHA::8}"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/submissions-checker-runner" >> "$GITHUB_OUTPUT"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "major=${V%%.*}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          docker build -f docker/runner/Dockerfile \
            -t "${IMAGE}:${{ steps.ver.outputs.version }}" .

      - name: Smoke test (CLI is wired)
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          docker run --rm "${IMAGE}:${{ steps.ver.outputs.version }}" --help

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/runner-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: startsWith(github.ref, 'refs/tags/runner-v')
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          docker tag "${IMAGE}:${{ steps.ver.outputs.version }}" "${IMAGE}:${{ steps.ver.outputs.major }}"
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}"
          docker push "${IMAGE}:${{ steps.ver.outputs.major }}"
