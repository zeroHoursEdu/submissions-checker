# Build, gate and publish the application image.
#
# Deploys are pull-initiated: this workflow only publishes an image, and the production
# host's Watchtower notices the new digest on the `main` tag and rolls the replicas one
# at a time. Nothing here needs access to the host — no SSH key, no inbound connection.
#
# Two tags per build:
#   :main         moves with the default branch; this is what Watchtower follows
#   :sha-<short>  immutable; this is what you pin to when rolling back
#
# The quality gates are what make unattended deployment safe: `main` only ever advances
# to a build that passed lint, types and the full test suite.
name: app-image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer commit on main supersedes an in-flight build; never race two publishes.
  group: app-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/submissions-checker

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/

      # Integration and functional tests start real PostgreSQL containers via
      # testcontainers, which needs the runner's Docker daemon — available by default.
      - name: Tests
        run: uv run pytest -q

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # Publication is gated: a failing build never becomes the image production pulls.
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive tags
        id: tags
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The production host is ARM (Oracle A1.Flex); contributors are predominantly
      # x86-64. One manifest serves both, so the same tag works everywhere.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          # Pull requests validate the build without publishing anything.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Report published tags
        if: github.event_name == 'push'
        run: |
          echo "Published:"
          echo "  ${IMAGE}:main            (Watchtower follows this)"
          echo "  ${IMAGE}:${{ steps.tags.outputs.sha }}   (pin this to roll back)"
