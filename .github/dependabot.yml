# Weekly dependency bumps as pull requests. Each one runs the quality and security
# workflows, so an upgrade with a regression never reaches main on its own.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all patch/minor bumps; majors stay separate so they are reviewed.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/runner"
    schedule:
      interval: "weekly"
