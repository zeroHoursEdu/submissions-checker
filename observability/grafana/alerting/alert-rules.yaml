apiVersion: 1
groups:
- orgId: 1
  name: subchk
  folder: Submissions Checker
  interval: 1m
  rules:
  - uid: subchk-service-down
    title: ServiceDown
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        refId: A
        expr: max(up{job="submissions-checker"}) < bool 1
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 3m
    noDataState: Alerting
    execErrState: Error
    labels:
      app: submissions-checker
    annotations:
      summary: No replica of Submissions Checker is answering scrapes, or nothing
        is pushing metrics.
  - uid: subchk-high-error-rate
    title: HighErrorRate
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        refId: A
        expr: (sum(rate(http_requests_total{job="submissions-checker",status_class="5xx"}[10m]))
          / sum(rate(http_requests_total{job="submissions-checker"}[10m])) > 0.05)
          and (sum(increase(http_requests_total{job="submissions-checker"}[10m]))
          > 20)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      app: submissions-checker
    annotations:
      summary: More than 5% of requests failed with 5xx over the last 10 minutes.
  - uid: subchk-db-unhealthy
    title: DbUnhealthy
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        refId: A
        expr: max(app_db_healthy{job="submissions-checker"}) == bool 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      app: submissions-checker
    annotations:
      summary: 'The app cannot query Postgres: the metrics refresh is failing on every
        replica.'
  - uid: subchk-outbox-stuck
    title: OutboxStuck
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: grafanacloud-prom
      model:
        refId: A
        expr: max(outbox_oldest_pending_age_seconds{job="submissions-checker"}) >
          900
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      app: submissions-checker
    annotations:
      summary: A background job has waited more than 15 minutes; checks and emails
        are not going out.
  - uid: subchk-quiz-force-fail-spike
    title: QuizForceFailSpike
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: grafanacloud-logs
      model:
        refId: A
        expr: sum(count_over_time({app="subchk", env="prod", service="app"} | json
          | event="quiz_attempt_force_failed" [10m])) > 5
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      app: submissions-checker
    annotations:
      summary: 'More than 5 quiz attempts auto-failed in 10 minutes: a rule or a browser
        change is likely misfiring. Open the Quiz investigation dashboard.'
  - uid: subchk-outbox-dead
    title: OutboxDead
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: grafanacloud-logs
      model:
        refId: A
        expr: sum(count_over_time({app="subchk", env="prod", service="app"} | json
          | event="outbox_dead" [15m])) > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 0m
    noDataState: OK
    execErrState: Error
    labels:
      app: submissions-checker
    annotations:
      summary: A background job exhausted its retries (check, AI review or email lost).
        See the Logs dashboard.
