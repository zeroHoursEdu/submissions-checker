consent:
  page_title: Згода на запис
  heading: Згода на запис під час проктерингу
  agree_button: Я погоджуюсь і продовжую
  footer_note: Натискаючи «Я погоджуюсь», ви підтверджуєте, що прочитали це повідомлення.
  notice_text: >-
    Деякі тести в цьому курсі проходять під наглядом через вашу веб-камеру. Поки відкрито тест
    із проктерингом, ваша камера аналізується у браузері, щоб підтвердити, що ви присутні та не
    використовуєте несанкціоновану допомогу. Якщо виявлено можливе порушення, знімок із
    веб-камери може бути захоплений і збережений як доказ для перегляду викладачем. Фотографії
    зберігаються лише для цілей академічної доброчесності та видаляються згідно з політикою
    зберігання курсу. Щоб продовжити, ви маєте погодитися; якщо ви не згодні, зверніться до
    викладача для організації очного іспиту.

