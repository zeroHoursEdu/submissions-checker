services:
  minio-e2e:
    image: quay.io/minio/minio:latest
    container_name: submissions-checker-minio-e2e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init-e2e:
    image: quay.io/minio/mc:latest
    container_name: submissions-checker-minio-init-e2e
    restart: "no"
    environment:
      MINIO_HOST: minio-e2e
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET_NAME: submissions-checker
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    depends_on:
      minio-e2e:
        condition: service_healthy

  postgres-e2e:
    image: postgres:16-alpine
    container_name: submissions-checker-postgres-e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: submissions_checker_e2e
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-e2e:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    container_name: submissions-checker-app-e2e
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-e2e:5432/submissions_checker_e2e
      - LOG_LEVEL=INFO
      - DEBUG=true
      - WATCHFILES_FORCE_POLLING=true
      - S3_ENDPOINT_URL=http://minio-e2e:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - SCHEDULER_ENABLED=true
      - SECRET_KEY=e2e-test-secret-key-do-not-use-in-production
      # No mail channel: credentials are read from the outbox payload by the tests,
      # and an unreachable SMTP host only produces retry noise.
      - OUTBOX_BATCH_SIZE=20
      - PLUGINS_DIR=/home/vampir/petProjects/submissions-checker/plugins
    env_file:
      - .env.e2e
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./templates:/app/templates
      - ./static:/app/static
      - ./i18n:/app/i18n
      # legacy: only for configs applied before migration 0018; remove with the uploads fallback
      - ./plugins:/app/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      postgres-e2e:
        condition: service_healthy
      minio-e2e:
        condition: service_healthy
      minio-init-e2e:
        condition: service_completed_successfully
    command: uvicorn submissions_checker.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
