{% extends "base.html" %}

{% block title %}{{ vocab.consent.page_title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-8">
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
    <div class="flex items-center gap-2 mb-4">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-600"></span>
      <h1 class="text-xl font-bold text-slate-900">{{ vocab.consent.heading }}</h1>
    </div>

    <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-line">{{ notice }}</p>

    <form method="POST" action="/portal/consent" class="mt-6 flex flex-col gap-3">
      <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors self-start">
        {{ vocab.consent.agree_button }}
      </button>
      <p class="text-xs text-slate-400">{{ vocab.consent.footer_note }}</p>
    </form>
  </div>
</div>
{% endblock %}
