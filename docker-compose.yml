services:
  localstack:
    image: localstack/localstack:3
    container_name: submissions-checker-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: submissions-checker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: submissions_checker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    container_name: submissions-checker-app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/submissions_checker
      - LOG_LEVEL=INFO
      - DEBUG=true
      - WATCHFILES_FORCE_POLLING=true
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_PUBLIC_BASE_URL=http://localhost:4566/submissions-checker
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - HOST_PLUGINS_DIR=${PWD}/plugins
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tmp/repos:/tmp/repos
      - ./templates:/app/templates
      - ./static:/app/static
      - ./i18n:/app/i18n
      - ./plugins:/app/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: uvicorn submissions_checker.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Observability harness (make observability-up) ─────────────────────────────────────
  # Prometheus + Grafana + Alloy rendering the same dashboards production uses. Behind a
  # profile so `make up` never starts them. See docs/observability.md.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: submissions-checker-prometheus
    profiles: ["observability"]
    command:
      # No scrape config of its own: Alloy pushes into it, exactly as it pushes to Grafana Cloud.
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: submissions-checker-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      # A local throwaway with nothing worth protecting; a login screen only slows a check down.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./observability/local/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # The very same files `make dashboards` / `make alerting` push to Grafana Cloud.
      - ./observability/grafana:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "3000:3000"

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: submissions-checker-alloy
    profiles: ["observability"]
    depends_on:
      - prometheus
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      # Prometheus' remote-write receiver ignores basic auth; non-empty dummies keep the
      # config path identical to the Grafana Cloud one.
      GRAFANA_CLOUD_PROM_URL: http://prometheus:9090/api/v1/write
      GRAFANA_CLOUD_PROM_USER: local
      GRAFANA_CLOUD_PROM_TOKEN: local
      SUBCHK_ENV: local
      APP_METRICS_HOST: app
    ports:
      - "12345:12345"

volumes:
  postgres_data:
