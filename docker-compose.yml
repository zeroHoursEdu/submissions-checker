services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: submissions-checker-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"   # console: http://localhost:9001 (minioadmin / minioadmin)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET_NAME: submissions-checker
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: submissions-checker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: submissions_checker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    container_name: submissions-checker-app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/submissions_checker
      - LOG_LEVEL=INFO
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - DEBUG=true
      - WATCHFILES_FORCE_POLLING=true
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - HOST_PLUGINS_DIR=${PWD}/plugins
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tmp/repos:/tmp/repos
      - ./templates:/app/templates
      - ./static:/app/static
      - ./i18n:/app/i18n
      # legacy: only for configs applied before migration 0018; remove with the uploads fallback
      - ./plugins:/app/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: uvicorn submissions_checker.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Observability harness (make observability-up) ─────────────────────────────────────
  # Prometheus + Grafana + Alloy rendering the same dashboards production uses. Behind a
  # profile so `make up` never starts them. See docs/observability.md.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: submissions-checker-prometheus
    profiles: ["observability"]
    command:
      # No scrape config of its own: Alloy pushes into it, exactly as it pushes to Grafana Cloud.
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.0
    container_name: submissions-checker-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/local/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: submissions-checker-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
      - loki
    environment:
      # A local throwaway with nothing worth protecting; a login screen only slows a check down.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./observability/local/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # The very same files `make dashboards` / `make alerting` push to Grafana Cloud.
      - ./observability/grafana:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "3000:3000"

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: submissions-checker-alloy
    profiles: ["observability"]
    depends_on:
      - prometheus
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Prometheus' remote-write receiver ignores basic auth; non-empty dummies keep the
      # config path identical to the Grafana Cloud one.
      GRAFANA_CLOUD_PROM_URL: http://prometheus:9090/api/v1/write
      GRAFANA_CLOUD_PROM_USER: local
      GRAFANA_CLOUD_PROM_TOKEN: local
      GRAFANA_CLOUD_LOKI_URL: http://loki:3100/loki/api/v1/push
      GRAFANA_CLOUD_LOKI_USER: local
      GRAFANA_CLOUD_LOKI_TOKEN: local
      SUBCHK_ENV: local
      SUBCHK_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-submissions-checker}
      APP_METRICS_HOST: app
    ports:
      - "12345:12345"

volumes:
  postgres_data:
  minio_data:
